<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeafTi - Login</title>
  <link rel="shortcut icon" href="images/logosemfundo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="css/styles.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="container d-flex justify-content-center">
    <div class="auth-container" style="max-width: 420px;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0 text-dark">Login</h2>
        <a href="quemsomos.html"><img src="images/logofolha.png" alt="Logo" width="35"></a>
      </div>

      <form id="login-form">
        <div class="mb-3">
          <label class="form-label fw-bold small text-muted">Usuário</label>
          <input type="text" class="form-control" id="username" placeholder="Digite seu usuário" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold small text-muted">Senha</label>
          <input type="password" class="form-control" id="password" placeholder="Digite sua senha" required>
        </div>
        
        <div class="d-flex justify-content-between mb-4 small">
          <a href="resetsenha.html" class="text-success text-decoration-none">Esqueci a Senha</a>
          <a href="cadastro.html" class="text-success text-decoration-none">Registre-se</a>
        </div>

        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Autenticar</button>
      </form>
      <p id="error-message" class="text-danger small text-center mt-2"></p>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
