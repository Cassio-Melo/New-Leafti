<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeafTi - Recuperar Senha</title>
  <link rel="shortcut icon" href="images/logosemfundo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="css/styles.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="container d-flex justify-content-center">
    <div class="auth-container" style="max-width: 450px;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold fs-4 m-0 text-dark">Reset de Senha</h2>
        <a href="login.html"><img src="images/logofolha.png" alt="Logo" width="30"></a>
      </div>

      <form id="reset-form">
        <div class="mb-3">
          <label class="form-label fw-bold small text-muted">E-mail Corporativo</label>
          <input type="email" class="form-control" id="Email" placeholder="nome@empresa.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold small text-muted">Confirme o E-mail</label>
          <input type="email" class="form-control" id="CEmail" placeholder="nome@empresa.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold small text-muted">Nova Senha</label>
          <input type="password" class="form-control" id="password" placeholder="********" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold small text-muted">Confirme a Senha</label>
          <input type="password" class="form-control" id="cpassword" placeholder="********" required>
        </div>

        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Alterar Credenciais</button>
      </form>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
